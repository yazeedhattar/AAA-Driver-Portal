<!DOCTYPE html>
<html>
<head>
  <base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ALL YOUR ORIGINAL CSS REMAINS EXACTLY THE SAME */
    :root{--gold:#c5a059;--dark:#0f0f0f;--card:#1a1a1a}body{font-family:'Times New Roman',serif;background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;padding:20px}.app-container{background:var(--card);width:100%;max-width:400px;padding:30px;border-radius:10px;border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center;box-sizing:border-box}.lang-toggle{display:flex;justify-content:center;background:#222;border-radius:20px;padding:5px;width:fit-content;margin:0 auto 20px;border:1px solid #444}.lang-toggle button{margin:0;padding:6px 15px;border-radius:15px;font-size:14px;background:0 0;color:#888;transition:.3s;border:none;cursor:pointer}.lang-toggle button.active{background:var(--gold);color:#000;font-weight:700}.logo-img{max-width:150px;display:block;margin:0 auto 20px}h2{color:var(--gold);margin:0 0 20px;font-family:sans-serif;font-size:16px;letter-spacing:1px;text-transform:uppercase}label{display:block;text-align:left;color:var(--gold);font-size:12px;margin-bottom:5px;font-family:sans-serif;text-transform:uppercase;margin-top:15px}input,select,textarea{width:100%;padding:12px;background:#222;border:1px solid #444;color:#fff;border-radius:5px;font-size:16px;box-sizing:border-box;outline:0;transition:.3s}input[type=checkbox]{width:auto;transform:scale(1.5);margin-right:10px}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{font-family:sans-serif;resize:vertical}.loc-input{background-color:#111;color:#888;border:1px dashed #444;pointer-events:none}button{width:100%;padding:15px;border:none;border-radius:5px;font-size:16px;font-weight:700;cursor:pointer;text-transform:uppercase;margin-top:25px;transition:.3s}.btn-gold{background:linear-gradient(to bottom,#d4af37,#c5a059);color:#000}.btn-red{background:#8b0000;color:#fff;border:1px solid #500}.btn-blue{background:#1a4f76;color:#fff;border:1px solid #0f3654;margin-top:10px}.btn-orange{background:#cc5500;color:#fff;border:1px solid #994000;margin-top:10px}.btn-dark{background:#333;color:#fff;border:1px solid #555;margin-top:10px}.btn-green{background:#2e7d32;color:#fff;border:1px solid #1b5e20;margin-top:10px}#endSection,#startSection{display:none}.step-container{display:none;border-top:1px solid #333;margin-top:20px;padding-top:5px;animation:fadeIn .5s;will-change:opacity,transform}@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}canvas{background:#fff;width:100%;height:150px;border-radius:5px;margin-top:5px}.hidden-box{display:none;background:#111;padding:15px;border-radius:5px;margin-top:10px;border:1px dashed #444}.live-dot{height:10px;width:10px;background-color:#4caf50;border-radius:50%;display:inline-block;animation:blinker 1.5s linear infinite;margin-right:5px;will-change:opacity}@keyframes blinker{50%{opacity:0}}#assignedAlert{display:none;background:#0a1910;border:1px solid #4caf50;padding:15px;border-radius:5px;margin-top:15px;cursor:pointer;text-align:left;animation:pulse 2s infinite;will-change:box-shadow}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,175,80,.4)}70%{box-shadow:0 0 0 10px rgba(76,175,80,0)}100%{box-shadow:0 0 0 0 rgba(76,175,80,0)}}#signboardOverlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;flex-direction:column;justify-content:center;align-items:center}#signClientName{color:var(--gold);font-size:8vw;text-align:center;font-family:'Times New Roman',serif;text-transform:uppercase;margin:20px;word-wrap:break-word;line-height:1.2}.pdf-box{display:none;background:#111;padding:15px;border-radius:5px;border:1px dashed var(--gold);margin-bottom:20px;text-align:center}.pdf-link{display:inline-block;background:var(--gold);color:#000;padding:10px 20px;border-radius:4px;text-decoration:none;font-weight:700;text-transform:uppercase;margin-top:10px;font-family:sans-serif;font-size:14px;width:100%;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="signboardOverlay">
    <button onclick="toggleSignboard()" style="position:absolute;top:20px;right:20px;width:50px;height:50px;background:#222;border-radius:25px;padding:0;font-size:20px;border:none">X</button>
    <img src="https://i.postimg.cc/cJhXywng/aaa-luxury-sport-cars-rental-logo.jpg" style="max-width:250px;margin-bottom:20px">
    <h1 id="signClientName">CLIENT NAME</h1>
  </div>

  <div class="app-container">
    <div class="lang-toggle"><button id="langEn" class="active" onclick="setLang('en')">EN</button><button id="langFr" onclick="setLang('fr')">FR</button></div>
    <img src="https://i.postimg.cc/cJhXywng/aaa-luxury-sport-cars-rental-logo.jpg" class="logo-img">
    <h2 data-i18n="title">Driver Portal</h2>

    <!-- Removed Google Apps Script PHP-style tag, handled by standard JS now -->
    <input type="hidden" id="magicLinkName" value="">

    <label data-i18n="selectName">Select Your Name</label>
    <select id="workerName" onchange="checkUser()"><option value="" disabled selected data-i18n="namePlace">Select name...</option></select>
    <div id="loader" style="display:none;color:#c5a059;margin-top:10px" data-i18n="loading">Loading...</div>

    <div id="preShiftDashboard" style="display:none;">
      <div id="assignedAlert" onclick="acceptAssignedShift()">
        <div style="font-weight:bold;color:#4caf50;font-size:14px;margin-bottom:5px">🔔 Assigned Mission</div>
        <div id="assignedDetails" style="font-size:13px;color:#ddd;font-family:sans-serif;line-height:1.4"></div>
        <div style="margin-top:10px;color:var(--gold);font-size:11px;text-transform:uppercase;font-weight:bold">Tap here to Start ></div>
      </div>
      <button class="btn-dark" onclick="startManualShift()" style="margin-top:15px">➕ Start Manual Shift</button>
    </div>

    <div id="startSection">
      <div id="stepBrand" style="display:block;">
        <label data-i18n="clientName">Client Name</label><input list="clients" id="clientName" data-i18n-place="clientPlace" placeholder="Select client..."><datalist id="clients"></datalist>
        <label data-i18n="carBrand">Car Brand</label><select id="carType" onchange="filterTypes()"><option value="" disabled selected data-i18n="brandPlace">Select vehicle brand...</option></select>
      </div>
      <div id="stepType" class="step-container"><label data-i18n="vType">Vehicle Type</label><select id="vType" onchange="filterNumbers()"><option value="" disabled selected data-i18n="typePlace">Select vehicle type...</option></select></div>
      <div id="stepNum" class="step-container"><label data-i18n="vNum">Vehicle Number</label><select id="vNum" onchange="showFinalStep()"><option value="" disabled selected data-i18n="numPlace">Select license plate...</option></select></div>
      <div id="stepFinal" class="step-container">
        
        <label data-i18n="startKms">Start KMS</label>
        <input type="number" id="startKms" data-i18n-place="kmsPlace" placeholder="Enter vehicle KMS...">
        
        <label data-i18n="startFuel">Start Fuel (%)</label>
        <input type="number" id="startFuel" data-i18n-place="fuelPlace" min="0" max="100" placeholder="0-100" oninput="if(this.value > 100) this.value = 100; if(this.value < 0 && this.value !== '') this.value = 0;">

        <label data-i18n="serviceType">Service Type</label><select id="serviceType"><option value="" disabled selected data-i18n="servicePlace">Select TRF or DISPO...</option></select>
        <label data-i18n="startLoc">Start Location</label><input type="text" id="startLoc" class="loc-input" readonly>
        <label data-i18n="startTime">Start Time</label><input type="time" id="startTime">
        <div id="signatureArea"><label data-i18n="clientSig">Client Signature</label><canvas id="theCanvas"></canvas><button type="button" data-i18n="clearSig" style="background:transparent;color:#aaa;padding:5px;font-size:12px;border:none" onclick="signaturePad.clear()">Clear Signature</button></div>
        <button class="btn-gold" id="btnStart" data-i18n="btnStart" onclick="doStart()">Start Job & Create PDF</button>
      </div>
    </div>

    <div id="endSection">
      <div style="background:#2a2a2a;padding:10px;margin-bottom:15px;border-radius:5px;color:#aaa;font-size:14px;margin-top:15px"><span class="live-dot"></span><span data-i18n="statusText">Status: </span><span style="color:#c5a059" data-i18n="onDuty">ON DUTY</span></div>
      <div id="pdfContainer" class="pdf-box"><label data-i18n="pdfLabel" style="margin-top:0;color:#fff;text-align:center">AGREEMENT PDF:</label><a id="activePdfLink" href="#" target="_blank" class="pdf-link" data-i18n="viewPdf">View Receipt</a></div>
      <div id="flightTrackerContainer" style="display:none;margin-bottom:20px"><button class="btn-blue" onclick="trackFlight()" style="margin-top:0;background:linear-gradient(to right,#0a2e46,#1a4f76);border-color:var(--gold);font-size:14px;padding:12px">✈️ Track VIP Flight: <span id="flightNumDisplay" style="color:var(--gold);font-weight:bold"></span></button></div>
      <div style="display:flex;gap:10px;margin-bottom:20px"><button class="btn-dark" style="margin-top:0" onclick="toggleSignboard()" data-i18n="btnSignboard">🪧 Signboard</button><button class="btn-green" style="margin-top:0" onclick="toggleBox('whatsappBox')" data-i18n="btnComms">💬 VIP Comms</button></div>
      
      <div id="whatsappBox" class="hidden-box" style="text-align:left;background:#0a1910;border-color:#1b5e20">
        <h3 style="color:#4caf50;font-size:14px;margin-top:0;margin-bottom:10px" data-i18n="commsHubTitle">WhatsApp Hub</h3>
        <label data-i18n="waPhone">Client Phone (+)</label><input type="tel" id="waPhoneInput" value="+33" style="margin-bottom:10px">
        <label data-i18n="waLang">Message Language</label><select id="waLangSelect" style="margin-bottom:15px"><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option><option value="ar">🇦🇪 العربية</option></select>
        <button class="btn-blue" style="margin-top:5px;background:#0277bd;font-size:14px;padding:12px" onclick="sendWA('enroute')" data-i18n="btnWaEnroute">🚗 Send "En Route"</button>
        <button class="btn-green" id="btnWaArrived" style="margin-top:10px;font-size:14px;padding:12px" onclick="sendWA('arrived')" data-i18n="btnWaArrived">📍 Send "Arrived"</button>
      </div>
      
      <div id="extraActions" style="margin-top:15px;padding-top:15px;border-top:1px solid #333">
        <h3 style="color:var(--gold);font-size:14px;margin-bottom:5px" data-i18n="driverActions">Driver Actions</h3>
        <button class="btn-blue" onclick="toggleBox('expenseBox')" data-i18n="btnAddExp">📸 Add Extra Expense</button>
        <div id="expenseBox" class="hidden-box"><label data-i18n="attachExp">Attach Media</label><input type="file" id="expenseFile" accept="image/*,video/*" multiple style="padding:5px;margin-bottom:10px"><button class="btn-gold" id="btnExp" data-i18n="btnUploadExp" onclick="submitExpense()">Upload Expense</button></div>
        <button class="btn-orange" onclick="toggleBox('reportBox')" data-i18n="btnReportProb">⚠️ Report Problem</button>
        <div id="reportBox" class="hidden-box"><label style="margin-top:0" data-i18n="whatHappened">What happened?</label><textarea id="reportDesc" rows="3" data-i18n-place="descPlace" placeholder="Describe..."></textarea><label data-i18n="attachRep">Attach Media</label><input type="file" id="reportFiles" accept="image/*,video/*" multiple style="padding:5px;margin-bottom:10px"><button class="btn-red" id="btnRep" data-i18n="btnSubmitRep" onclick="submitReport()">Submit Report</button></div>
      </div>
      
      <label data-i18n="endKms">End KMS</label>
      <input type="number" id="endKms" data-i18n-place="endKmsPlace" placeholder="Enter ending KMS...">

      <label data-i18n="endLoc">End Location</label><input type="text" id="endLoc" class="loc-input" readonly>
      <button class="btn-orange" id="btnEndShift" data-i18n="btnEndShift" onclick="finishJob(false)" style="margin-bottom:10px">End Shift</button>
      <button class="btn-red" id="btnEnd" data-i18n="btnEnd" onclick="finishJob(true)">End Job</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <script>
    // --- IMPORTANT: PASTE YOUR DEPLOYED GOOGLE SCRIPT URL HERE ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKSDk3pmZAGBBMcziKf_nlHYmBRd21c88W0zGquao4PYel8-UFiAkhLVHEINbUtQmJTg/exec"; 
    
    const $ = function(id) { return document.getElementById(id); };
    const $$ = function(sel) { return document.querySelectorAll(sel); };
    
    // --- NEW REST API WRAPPER ---
    const runGs = async function(fn, ...args) {
      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' }, // Plain text avoids CORS preflight failures
          body: JSON.stringify({ functionName: fn, arguments: args })
        });
        const result = await response.json();
        if (result.success) return result.data;
        else throw new Error(result.error);
      } catch (e) {
        console.error("API Error calling " + fn + ":", e);
        throw e;
      }
    };
    
    const setBtn = function(id, txt, dis) { let b = $(id); b.innerText = txt; b.disabled = dis; };
    const toggleBox = function(id) { let s = $(id).style; s.display = s.display === "none" || !s.display ? "block" : "none"; };
    
    const getUnique = function(arr) { return [...new Set(arr)]; };

    let webAppUrl = WEB_APP_URL, trackingInterval = null, assignedMissionData = null, signaturePad, allVehicleData = [], currentShiftDetails = {}, isCheckingUser = false, currentLang = "en"; 
    
    let t = {
      en: { title:"Driver Portal", selectName:"Select Your Name", namePlace:"Select name...", loading:"Loading...", clientName:"Client Name", clientPlace:"Select client...", carBrand:"Car Brand", brandPlace:"Select brand...", vType:"Vehicle Type", typePlace:"Select type...", vNum:"Vehicle Number", numPlace:"Select plate...", serviceType:"Service Type", servicePlace:"Select TRF/DISPO...", startLoc:"Start Location", waitGps:"Waiting for GPS...", locating:"Locating...", gpsFail:"GPS Failed", gpsNotSupp:"GPS Not Supported", startTime:"Start Time", clientSig:"Client Signature", clearSig:"Clear Signature", btnStart:"Start Job & Create PDF", statusText:"Status: ", onDuty:"ON DUTY (GPS LIVE)", btnSignboard:"🪧 Signboard", btnComms:"💬 VIP Comms", commsHubTitle:"WhatsApp Hub", waPhone:"Client Phone (+)", waLang:"Message Language", btnWaEnroute:"🚗 Send 'En Route'", btnWaArrived:"📍 Send 'Arrived'", pdfLabel:"AGREEMENT PDF:", viewPdf:"View Receipt", btnReportProb:"⚠️ Report Problem", whatHappened:"What happened?", descPlace:"Describe incident...", attachRep:"Attach Photos/Videos", btnSubmitRep:"Submit Report", endLoc:"End Location (Auto)", btnEnd:"End Job", btnEndShift:"End Shift", fillAll:"Fill all fields", mustSign:"Client must sign!", stamping:"Stamping PDF...", saving:"Saving...", selectFiles:"Please select files.", uploading:"Uploading...", provideDesc:"Provide description.", submitting:"Submitting...", errServer:"Server Error: ", startKms: "Start KMS", startFuel: "Start Fuel (%)", kmsPlace: "Enter vehicle KMS...", fuelPlace: "0-100", endKms: "End KMS", endKmsPlace: "Enter ending KMS...", },
      fr: { title:"Portail Chauffeur", selectName:"Sélectionnez votre nom", namePlace:"Sélectionnez un nom...", loading:"Chargement...", clientName:"Nom du client", clientPlace:"Sélectionnez un client...", carBrand:"Marque", brandPlace:"Sélectionnez la marque...", vType:"Modèle", typePlace:"Sélectionnez le modèle...", vNum:"Immatriculation", numPlace:"Sélectionnez la plaque...", serviceType:"Type de service", servicePlace:"Sélectionnez TRF/DISPO...", startLoc:"Lieu de départ", waitGps:"En attente GPS...", locating:"Localisation...", gpsFail:"Échec GPS", gpsNotSupp:"GPS non supporté", startTime:"Heure de départ", clientSig:"Signature", clearSig:"Effacer signature", btnStart:"Démarrer et Créer PDF", statusText:"Statut : ", onDuty:"EN SERVICE (GPS)", btnSignboard:"🪧 Panneau VIP", btnComms:"💬 Comms VIP", commsHubTitle:"Hub WhatsApp", waPhone:"Numéro Client (+)", waLang:"Langue", btnWaEnroute:"🚗 Envoyer 'En Route'", btnWaArrived:"📍 Envoyer 'Arrivé'", pdfLabel:"PDF DE MISSION :", viewPdf:"Voir le reçu", driverActions:"Actions chauffeur", btnReportProb:"⚠️ Signaler problème", whatHappened:"Que s'est-il passé ?", descPlace:"Décrivez l'incident...", attachRep:"Joindre Photos", btnSubmitRep:"Envoyer rapport", endLoc:"Lieu de fin (Auto)", btnEnd:"Terminer mission", btnEndShift:"Terminer service", fillAll:"Remplissez tous champs", mustSign:"Le client doit signer !", stamping:"Création PDF...", saving:"Enregistrement...", selectFiles:"Sélectionnez fichiers.", uploading:"Envoi...", provideDesc:"Fournissez description.", submitting:"Envoi...", errServer:"Erreur serveur : ", startKms: "KM de Départ", startFuel: "Carburant Départ (%)", kmsPlace: "Entrez le kilométrage...", fuelPlace: "0-100", endKms: "KM de Fin", endKmsPlace: "Entrez le KM de fin...", keyLoc: "Emplacement des clés", keyLocPlace: "Où sont les clés ?" }
    };

    function setLang(l) { 
      currentLang = l; 
      $$('[data-i18n]').forEach(function(e) { if(t[l][e.dataset.i18n]) e.innerText = t[l][e.dataset.i18n]; });
      $$('[data-i18n-place]').forEach(function(e) { if(t[l][e.dataset.i18nPlace]) e.placeholder = t[l][e.dataset.i18nPlace]; });
      $("langEn").className = l === "en" ? "active" : ""; $("langFr").className = l === "fr" ? "active" : "";
      
      let st = $("serviceType");
      if(st && st.options.length > 0) st.options[0].innerText = t[l].servicePlace;
    }
    
    const fillList = function(id, items) { 
      const el = $(id); 
      if(!el) return;
      const isSelect = el.tagName === "SELECT";
      const firstOpt = isSelect && el.options.length > 0 ? el.options[0].cloneNode(true) : null;
      
      el.innerHTML = "";
      if (firstOpt) el.appendChild(firstOpt);
      
      if (items && items.length) {
        const frag = document.createDocumentFragment();
        items.forEach(function(i) {
          let val = String(i || "").trim();
          let opt = document.createElement("option");
          opt.value = val;
          if (isSelect) opt.textContent = val;
          frag.appendChild(opt);
        });
        el.appendChild(frag);
      }
    };

    window.onload = function() { 
      setLang("en"); 
      let loader = $("loader");
      loader.style.display = "block";
      
      let timeoutMsg = setTimeout(function() {
          loader.innerHTML = "⚠️ Loading is slow. Please refresh or check connection.";
      }, 6000);

      runGs("getAppData").then(function(d) {
        clearTimeout(timeoutMsg);
        loader.style.display = "none";
        
        if(!d) {
          console.warn("Server returned null. Check Sheet for invalid data.");
          return; 
        }
        
        fillList("workerName", d.workers); 
        fillList("clients", d.clients); 
        fillList("serviceType", d.services); 
        allVehicleData = d.vehicleData || [];
        
        // GITHUB UPDATE: Read driver name from standard URL parameters (e.g. ?driver=John)
        const urlParams = new URLSearchParams(window.location.search);
        const autoDriverName = urlParams.get('driver') || "";
        const magicInput = $("magicLinkName");
        if (magicInput) magicInput.value = autoDriverName;
        
        let uniqueBrands = getUnique(allVehicleData.map(function(v) { return v.brand; }));
        fillList("carType", uniqueBrands); 
        
        if (autoDriverName) {
           if (d.workers && d.workers.indexOf(autoDriverName) !== -1) {
             $("workerName").value = autoDriverName;
             checkUser();
           } else {
             alert("⚠️ Link Error: Driver name '" + autoDriverName + "' not found.");
           }
        }
      }).catch(function(e) {
        clearTimeout(timeoutMsg);
        loader.innerHTML = "❌ Connection Error. Please refresh the page.";
      });
      
      let canvas = $("theCanvas");
      if(canvas) { 
        try { signaturePad = new SignaturePad(canvas); } catch(e){} 
      }
      $("startTime").value = new Date().toTimeString().substring(0,5); 
    };
    
    function filterTypes() { 
      let brandVal = $("carType").value;
      let types = new Set();
      for(let i = 0; i < allVehicleData.length; i++) {
         if(allVehicleData[i].brand === brandVal) types.add(allVehicleData[i].type);
      }
      fillList("vType", [...types]); 
      $("vType").value = $("vNum").value = ""; 
      $("stepType").style.display = "block"; 
      $("stepNum").style.display = $("stepFinal").style.display = "none"; 
    }
    
    function filterNumbers() { 
      let brandVal = $("carType").value, typeVal = $("vType").value;
      let nums = new Set();
      for(let i = 0; i < allVehicleData.length; i++) {
         if(allVehicleData[i].brand === brandVal && allVehicleData[i].type === typeVal) nums.add(allVehicleData[i].num);
      }
      fillList("vNum", [...nums]); 
      $("vNum").value = ""; 
      $("stepNum").style.display = "block"; 
      $("stepFinal").style.display = "none"; 
    }
    
    function showFinalStep() { 
      if($("vNum").value) { $("stepFinal").style.display = "block"; resizeCanvas(); } 
    }

    function getLocation(id) { 
      $(id).value = t[currentLang].locating; 
      if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          runGs("getAddressFromLatLong", pos.coords.latitude, pos.coords.longitude).then(function(a) { $(id).value = a; });
        }, function() { $(id).value = t[currentLang].gpsFail; }, { enableHighAccuracy: true }); 
      } else {
        $(id).value = t[currentLang].gpsNotSupp; 
      }
    }

    function startLiveTracking() { 
      if(trackingInterval) clearInterval(trackingInterval); 
      let n = $("workerName").value; 
      trackingInterval = setInterval(function() {
        navigator.geolocation.getCurrentPosition(function(p) {
          runGs("updateLiveLocation", n, p.coords.latitude, p.coords.longitude);
        }, function(){}, {enableHighAccuracy: true});
      }, 15000); 
    }

    function trackFlight() { 
      let f = currentShiftDetails.flightNum; 
      if(f) window.open("https://flightaware.com/live/flight/" + f.replace(/\s+/g, "").toUpperCase(), "_blank"); 
    }

    async function checkUser() {
      let name = $("workerName").value; if(!name || isCheckingUser) return; isCheckingUser = true; 
      currentShiftDetails = {}; assignedMissionData = null;
      ["preShiftDashboard","loader","startSection","endSection","pdfContainer","flightTrackerContainer"].forEach(function(i) {
        $(i).style.display = i==="loader"||i==="preShiftDashboard" ? "block" : "none";
      });
      if($("assignedAlert")) $("assignedAlert").style.display = "none";

      try {
        let res = await runGs("checkStatus", name); isCheckingUser = false; $("loader").style.display = "none";
        if(res.status === "Open") {
          $("preShiftDashboard").style.display = "none"; $("endSection").style.display = "block"; getLocation("endLoc");
          currentShiftDetails = { client:res.client, brand:res.brand, vType:res.vType, vNum:res.vNum, flightNum:res.flightNum, pdf:res.pdf, sig: res.sig }; startLiveTracking();
          if(res.flightNum && res.flightNum.trim()) { $("flightNumDisplay").innerText = res.flightNum; $("flightTrackerContainer").style.display = "block"; }
          if(res.pdf && res.pdf !== "Error") { $("activePdfLink").href = res.pdf; $("pdfContainer").style.display = "block"; }
        } else if(res.status === "BetweenShifts") {
          if(confirm(currentLang === "en" ? "Continue mission for " + res.client + "?" : "Continuer pour " + res.client + "?")) {
            $("preShiftDashboard").style.display = "none"; $("startSection").style.display = "block";
            $("clientName").value = res.client; 
            fillList("carType", [res.brand]); $("carType").value = res.brand;
            fillList("vType", [res.vType]); $("vType").value = res.vType;
            fillList("vNum", [res.vNum]); $("vNum").value = res.vNum;
            $("signatureArea").style.display = "none"; currentShiftDetails = { pdf:res.pdf, client:res.client, sig: res.sig }; 
            ["stepType", "stepNum", "stepFinal"].forEach(function(i) { $(i).style.display = "block"; }); getLocation("startLoc"); resizeCanvas();
          } else { $("preShiftDashboard").style.display = $("signatureArea").style.display = "block"; }
        } else if(res.assigned) {
          assignedMissionData = res.assigned; 
          $("assignedDetails").innerHTML = "<b>Client:</b> " + res.assigned.client + "<br><b>Vehicle:</b> " + res.assigned.brand + " " + res.assigned.vType + " (" + res.assigned.vNum + ")<br><b>Time:</b> " + res.assigned.time;
          $("assignedAlert").style.display = $("signatureArea").style.display = "block";
        } else $("preShiftDashboard").style.display = $("signatureArea").style.display = "block";
      } catch(err) { isCheckingUser = false; $("loader").style.display = "none"; alert(t[currentLang].errServer + err); }
    }

    function toggleSignboard() { 
      let o = $("signboardOverlay"); 
      if(o.style.display === "flex") { o.style.display = "none"; }
      else { 
        $("signClientName").innerText = currentShiftDetails.client || (assignedMissionData ? assignedMissionData.client : null) || "VIP GUEST"; 
        o.style.display = "flex"; 
      } 
    }

    function acceptAssignedShift() {
      $("preShiftDashboard").style.display = "none"; $("startSection").style.display = "block";
      $("clientName").value = assignedMissionData.client; 
      fillList("carType", [assignedMissionData.brand]); $("carType").value = assignedMissionData.brand;
      fillList("vType", [assignedMissionData.vType]); $("vType").value = assignedMissionData.vType;
      fillList("vNum", [assignedMissionData.vNum]); $("vNum").value = assignedMissionData.vNum;
      $("serviceType").value = assignedMissionData.service || "TRF"; $("startLoc").value = "AAA Garage"; $("startTime").value = assignedMissionData.time || new Date().toTimeString().substring(0,5);
      ["stepType", "stepNum", "stepFinal"].forEach(function(i) { $(i).style.display = "block"; }); resizeCanvas();
    }

    function startManualShift() { $("preShiftDashboard").style.display = "none"; $("startSection").style.display = "block"; getLocation("startLoc"); }

    function sendWA(type) { 
      let p = $("waPhoneInput").value.replace(/\s+/g, ""); 
      if(p.length < 5) return alert("Please enter phone number."); 
      
      let btn = $("btnWaArrived"), og = btn.innerText;
      let l = $("waLangSelect").value, d = $("workerName").value;
      let c = currentShiftDetails.brand || "Luxury Vehicle";
      let hr = new Date().getHours();
      
      let g = "";
      if (l === "en") g = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
      else if (l === "fr") g = hr < 18 ? "Bonjour" : "Bonsoir";
      else g = hr < 12 ? "صباح الخير" : hr < 18 ? "يسعد مساك" : "مساء الخير";
      
      let tr = webAppUrl + "?track=" + encodeURIComponent(d);
      let msg = "";
      
      if (l === "en") {
        msg = type === "enroute" ? g + ", this is " + d + ", your AAA Luxury chauffeur. I am en route in the " + c + ".\n\nTrack my live arrival:\n📍 " + tr : g + ", this is " + d + ". I have arrived in the " + c + ". Location: ";
      } else {
        msg = type === "enroute" ? g + ", c'est " + d + ", votre chauffeur AAA Luxury. Je suis en route à bord du " + c + ".\n\nSuivez mon arrivée :\n📍 " + tr : g + ", c'est " + d + ". Je suis arrivé dans le " + c + ". Ma position : ";
      }
      
      const trig = function(m) { 
        let a = document.createElement("a"); 
        a.href = "https://wa.me/" + p + "?text=" + encodeURIComponent(m); 
        a.target = "_top"; 
        document.body.appendChild(a); 
        a.click(); 
        document.body.removeChild(a); 
        btn.innerText = og; 
      };
      
      if(type === "arrived") { 
        btn.innerText = t[currentLang].locating; 
        navigator.geolocation.getCurrentPosition(function(pos) {
          trig(msg + "http://googleusercontent.com/maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude);
        }, function() { alert("GPS required."); btn.innerText = og; }, {enableHighAccuracy: true}); 
      } else { 
        trig(msg); 
      } 
    }
    
    const getBase64 = function(file) {
      return new Promise(function(res) { 
        let r = new FileReader(); r.readAsDataURL(file); 
        r.onload = function(e) { 
          if(!file.type.startsWith("image/")) return res({data:r.result, mimeType:file.type, name:file.name}); 
          let img = new Image(); img.src = e.target.result; 
          img.onload = function() { 
            let c = document.createElement("canvas"), w = img.width, h = img.height; 
            if(w>1200){h*=1200/w; w=1200;} 
            c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); 
            res({data:c.toDataURL("image/jpeg",0.6), mimeType:"image/jpeg", name:file.name}); 
          }; 
        }; 
      });
    };

    function drawFuelGauge(page, cx, cy, percentage) {
      let r = 6.5; 
      let p = Math.min(Math.max(percentage, 0), 100);

      const pointsToSvgPath = function(pts) {
        return pts.map(function(pt, i) { return (i === 0 ? "M " + pt.x + "," + pt.y : "L " + pt.x + "," + pt.y); }).join(" ") + " Z";
      };
      
      let bgPts = [{x: 0, y: 0}];
      for (let i = 180; i >= 0; i -= 5) {
        let rad = i * Math.PI / 180;
        bgPts.push({ x: r * Math.cos(rad), y: -r * Math.sin(rad) });
      }
      
      page.drawSvgPath(pointsToSvgPath(bgPts), {
        x: cx, y: cy, color: PDFLib.rgb(0.9, 0.9, 0.9), borderColor: PDFLib.rgb(0, 0, 0), borderWidth: 1
      });

      if (p > 0) {
        let fillPts = [{x: 0, y: 0}];
        let startAngle = 180; 
        let endAngle = 180 - (p / 100) * 180; 
        
        for (let j = startAngle; j >= endAngle; j -= 5) {
          let rad2 = j * Math.PI / 180; fillPts.push({ x: r * Math.cos(rad2), y: -r * Math.sin(rad2) });
        }
        
        let endRad = endAngle * Math.PI / 180;
        fillPts.push({ x: r * Math.cos(endRad), y: -r * Math.sin(endRad) });
        page.drawSvgPath(pointsToSvgPath(fillPts), { x: cx, y: cy, color: PDFLib.rgb(0.2, 0.2, 0.2) });
      }
    }

    async function doStart() {
      setBtn("btnStart", t[currentLang].stamping, true);
      
      let data = { 
        name:$("workerName").value, client:$("clientName").value, car:$("carType").value, vType:$("vType").value, vNum:$("vNum").value, service:$("serviceType").value, 
        location:$("startLoc").value, timeStr:$("startTime").value, assignedRowIdx: (assignedMissionData ? assignedMissionData.rowIdx : null), flightNum: (assignedMissionData ? assignedMissionData.flightNum : ""), 
        pdfUrl:currentShiftDetails.pdf||"", startKms: $("startKms").value, startFuel: $("startFuel").value
      };
      
      if(!data.name||!data.client||!data.car||!data.startKms||!data.startFuel) { 
        setBtn("btnStart", t[currentLang].btnStart, false); return alert(t[currentLang].fillAll); 
      }
      
      let isNew = !data.pdfUrl; 
      if(isNew && signaturePad && signaturePad.isEmpty()) { setBtn("btnStart", t[currentLang].btnStart, false); return alert(t[currentLang].mustSign); } 
      
      if(isNew && signaturePad) data.signature = signaturePad.toDataURL();
      else data.signature = currentShiftDetails.sig || "";

      try {
        let tmpl = isNew ? await runGs("getPdfTemplate") : await runGs("getFileB64ByUrl", data.pdfUrl);
        let shiftCount = isNew ? 0 : (parseInt(await runGs("getMissionShiftCount", data.name, data.client)) || 0);
        
        let doc = await PDFLib.PDFDocument.load(tmpl);
        
        // --- PAGINATION LOGIC (12 SHIFTS PER PAGE) ---
        let pageIndex = Math.floor(shiftCount / 12);
        let shiftOnPage = shiftCount % 12;
        let yOff = 680 - (shiftOnPage * 26); 
        
        if (!isNew && shiftOnPage === 0 && shiftCount > 0) {
            let cleanTmpl = await runGs("getPdfTemplate");
            let cleanDoc = await PDFLib.PDFDocument.load(cleanTmpl);
            let [newPage] = await doc.copyPages(cleanDoc, [0]);
            doc.insertPage(pageIndex, newPage); 
            
            let newP = doc.getPages()[pageIndex];
            newP.drawText(data.name, {x:90,y:755,size:10}); 
            newP.drawText(data.car + " " + data.vType, {x:90,y:742,size:9}); 
            newP.drawText(data.vNum, {x:90,y:730,size:10}); 
        }
        
        let p = doc.getPages()[pageIndex];
        // ---------------------------------------------
        
        if(isNew) { 
          p.drawText(data.name, {x:90,y:755,size:10}); 
          p.drawText(data.car + " " + data.vType, {x:90,y:742,size:9}); 
          p.drawText(data.vNum, {x:90,y:730,size:10}); 
          
          if(data.signature) {
            let sigImg = await doc.embedPng(data.signature);
            p.drawImage(sigImg, {x:340,y:110,width:120,height:50}); 
            p.drawText(new Date().toLocaleDateString(), {x:40, y:150, size:5});
            p.drawImage(sigImg, {x:10, y:120, width: sigImg.width * 0.1, height: sigImg.height * 0.1});
          }

          let startFuelNum = parseFloat(data.startFuel) || 0;
          drawFuelGauge(p, 127, 125, startFuelNum); 
          p.drawText("Start Fuel: " + startFuelNum + "%", { x: 90, y: 100, size: 6 });
          
          // --- APPEND EXTRA PDFs AT CREATION ---
          try {
             let extraPdfs = await runGs("getExtraPdfsB64", data.name);
             let b64s = [extraPdfs.s1, extraPdfs.s2, extraPdfs.driverPdf];
             
             for(let b64 of b64s) {
               if(b64) {
                 let exDoc = await PDFLib.PDFDocument.load(b64);
                 let copied = await doc.copyPages(exDoc, exDoc.getPageIndices());
                 copied.forEach(cp => doc.addPage(cp));
               }
             }
          } catch(extraErr) { console.warn("Failed to attach extra PDFs", extraErr); }
        }
        
        let loc = data.location||"", l1 = loc, l2 = ""; if(loc.indexOf(",") !== -1) { let pt = loc.split(","); l1 = pt[0]+","; l2 = pt.slice(1).join(",").trim(); } else if(loc.length>20) { let w = loc.split(" "), m = Math.ceil(w.length/2); l1 = w.slice(0,m).join(" "); l2 = w.slice(m).join(" "); }
        
        p.drawText(new Date().toLocaleDateString(), {x:30,y:yOff,size:9}); p.drawText(l1, {x:90,y:yOff +5,size:4}); if(l2) p.drawText(l2, {x:90,y:yOff,size:4}); p.drawText(data.vNum, {x:153,y:yOff,size:9}); p.drawText(data.service, {x:220,y:yOff,size:9}); p.drawText(data.timeStr, {x:280,y:yOff,size:9}); p.drawText(String(data.startKms), {x:345,y:yOff,size:9});
        
        data.pdfBase64 = await doc.saveAsBase64(); 
        await runGs("handleClockIn", data, currentLang); setBtn("btnStart", t[currentLang].btnStart, false); checkUser();
      } catch(e) { alert("Error: " + e); setBtn("btnStart", t[currentLang].btnStart, false); }
    }

    async function finishJob(isFinal) { 
      let btnId = isFinal ? "btnEnd" : "btnEndShift";
      let btnOrig = $(btnId).innerText; 
      
      let endKmsVal = $("endKms").value;
      if (!endKmsVal) { return alert(currentLang === "en" ? "Please enter End KMS before completing." : "Veuillez entrer le kilométrage de fin."); }

      let endFuelVal = "";
      if (isFinal) {
        if (!confirm(currentLang==="en" ? "Is this the FINAL day of the contract? (Closes mission)" : "Est-ce le DERNIER jour du contrat ? (Clôture la mission)")) return;
        while (true) {
          endFuelVal = prompt(currentLang==="en" ? "Mission Ending: Enter final Fuel Level (0-100%):" : "Fin de mission: Entrez le niveau de carburant (0-100%) :");
          if (endFuelVal === null) return; 
          if (endFuelVal.trim() === "") { alert(currentLang==="en" ? "Fuel level is required to end the mission." : "Le niveau de carburant est requis."); return; }
          let fuelNum = parseFloat(endFuelVal);
          if (!isNaN(fuelNum) && fuelNum >= 0 && fuelNum <= 100) { endFuelVal = fuelNum.toString(); break; } 
          else { alert(currentLang==="en" ? "Error: Please enter a valid number between 0 and 100." : "Erreur: Veuillez entrer un nombre valide entre 0 et 100."); }
        }
      }

      setBtn(btnId, t[currentLang].saving, true); 
      if(trackingInterval) clearInterval(trackingInterval);
      
      let pdfB64 = null, endTimeStr = new Date().toTimeString().substring(0,5), name = $("workerName").value;
      let endLocationVal = $("endLoc").value || ""; 
      
      try {
        if(currentShiftDetails.pdf && currentShiftDetails.pdf !== "Error") {
          let doc = await PDFLib.PDFDocument.load(await runGs("getFileB64ByUrl", currentShiftDetails.pdf)), fnt = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
          
          // --- TARGET CORRECT PAGE FOR CLOCK OUT ---
          let r = parseInt(await runGs("getMissionShiftCount", name, currentShiftDetails.client)) || 1;
          let shiftIndex = Math.max(0, r - 1);
          
          let pageIndex = Math.floor(shiftIndex / 12);
          let shiftOnPage = shiftIndex % 12;
          let yOff = 680 - (shiftOnPage * 26); 
          
          let p = doc.getPages()[pageIndex];
          // -----------------------------------------
          
          p.drawText(endTimeStr, {x:315, y:yOff, size:9, font:fnt});
          p.drawText(String(endKmsVal), {x:390, y:yOff, size:9, font:fnt});
          
          let loc = endLocationVal, l1 = loc, l2 = ""; 
          if(loc.indexOf(",") !== -1) { let pt = loc.split(","); l1 = pt[0] + ","; l2 = pt.slice(1).join(",").trim(); } 
          else if(loc.length > 20) { let w = loc.split(" "), m = Math.ceil(w.length/2); l1 = w.slice(0, m).join(" "); l2 = w.slice(m).join(" "); }
          
          p.drawText(l1, {x:440, y:yOff + 6, size:5, font:fnt}); 
          if(l2) p.drawText(l2, {x:440, y:yOff - 6, size:5, font:fnt});

          if (isFinal && currentShiftDetails.sig) {
            try {
              let sigImg = await doc.embedPng(currentShiftDetails.sig);
              p.drawText(new Date().toLocaleDateString(), {x: 170, y: 150, size: 5, font: fnt});
              p.drawImage(sigImg, {x: 145, y: 120, width: sigImg.width * 0.1, height: sigImg.height * 0.1});
            } catch (err) { console.warn("Could not draw final signature: ", err); }
          }

          if (isFinal && endFuelVal !== "") {
             let endFuelNum = parseFloat(endFuelVal) || 0;
             drawFuelGauge(p, 254, 125, endFuelNum); 
             p.drawText("End Fuel: " + endFuelNum + "%", { x: 190, y: 90, size: 6, font: fnt });
          }

          pdfB64 = await doc.saveAsBase64();
        }
      } catch(e) { console.warn("PDF Stamping Error: " + e); }
      
      try {
        let keyEl = $("keyLoc");
        let payload = { 
          name: name, loc:endLocationVal, keyLoc: (keyEl ? keyEl.value : ""), 
          pdfBase64:pdfB64, pdfUrl:currentShiftDetails.pdf, endTimeStr: endTimeStr,
          endKms: endKmsVal, endFuel: endFuelVal 
        };
        let res = await runGs("handleClockOut", payload, currentLang);
        alert(res.msg); 
        location.reload();
      } catch(err) { alert(err); setBtn(btnId, btnOrig, false); }
    }
    
    function resizeCanvas() { let r = Math.max(window.devicePixelRatio||1,1); let c = $("theCanvas"); if(c){ c.width = c.offsetWidth*r; c.height = c.offsetHeight*r; c.getContext("2d").scale(r,r); } }
    
    async function submitReport() { 
      let desc = $("reportDesc").value, files = $("reportFiles").files; if(!desc && !files.length) return alert(t[currentLang].provideDesc); 
      setBtn("btnRep", t[currentLang].submitting, true); 
      
      let arr = await Promise.all(Array.from(files).map(getBase64));
      
      runGs("saveVehicleReport", { driverName:$("workerName").value, brand:currentShiftDetails.brand, vType:currentShiftDetails.vType, vNum:currentShiftDetails.vNum, description:desc, files:arr }).then(function(r) { alert(r.msg); setBtn("btnRep", t[currentLang].btnSubmitRep, false); toggleBox("reportBox"); $("reportDesc").value=$("reportFiles").value=""; }).catch(function(e) { alert(e); setBtn("btnRep", t[currentLang].btnSubmitRep, false); }); 
    }

    async function submitExpense() {
      let files = $("expenseFile").files; if(!files.length) return alert(t[currentLang].selectFiles); setBtn("btnExp", t[currentLang].uploading, true);
      
      let arr = await Promise.all(Array.from(files).map(getBase64));
      
      runGs("saveExtraExpense", $("workerName").value, arr).then(function(r) { alert(r.msg); setBtn("btnExp", t[currentLang].btnAddExp, false); toggleBox("expenseBox"); $("expenseFile").value=""; });
    }
  </script>
